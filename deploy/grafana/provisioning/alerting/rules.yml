apiVersion: 1

groups:
  - orgId: 1
    name: equipment-service-alerts
    folder: Alerts
    interval: 1m
    rules:
      - uid: high-5xx-ratio
        title: High 5xx error ratio
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: { from: 300, to: 0 }
            model:
              expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m]))
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
        annotations:
          summary: "Доля ответов 5xx выше 5% в течение 5 минут"
          description: |
            Порядок действий:
            1. Дашборд, панели «4xx / 5xx» и «Интенсивность запросов»: определить маршрут с ошибками.
            2. Взять requestId из ответа клиента или найти: docker compose logs api | grep '"statusCode":5'
            3. Проверить зависимости: curl http://localhost/api/health/ready и docker compose ps.
            4. Если ошибки WEATHER_* на /weather, виноват внешний погодный API: остальные маршруты не затронуты, ждать восстановления.
            5. Если INTERNAL_ERROR, читать стек в логах api по requestId; при необходимости откатить версию.
            6. После устранения убедиться, что доля 5xx вернулась в норму и алерт стал Normal.
          runbook_url: https://github.com/Landin-droid/express-equipment-service/blob/main/docs/RUNBOOK.md#2-рост-доли-ответов-5xx
        labels:
          severity: critical