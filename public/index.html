<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Заявки на обслуживание оборудования</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #1a1a1a;
      }
      h1 {
        font-size: 1.4rem;
      }
      h2 {
        font-size: 1.1rem;
        margin-top: 2rem;
      }
      .filters,
      .form-grid {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: end;
        margin-bottom: 1rem;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.85rem;
      }
      select,
      input,
      textarea,
      button {
        padding: 0.4rem 0.6rem;
        font-size: 0.9rem;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        cursor: pointer;
        background: #2563eb;
        color: white;
        border: none;
      }
      button:hover {
        background: #1d4ed8;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0.5rem;
      }
      th,
      td {
        text-align: left;
        padding: 0.5rem;
        border-bottom: 1px solid #eee;
        font-size: 0.85rem;
      }
      .badge {
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        font-size: 0.75rem;
        color: white;
      }
      .status-new {
        background: #6b7280;
      }
      .status-in_progress {
        background: #2563eb;
      }
      .status-done {
        background: #16a34a;
      }
      .status-rejected {
        background: #dc2626;
      }
      .error {
        color: #dc2626;
        font-size: 0.85rem;
        margin-top: 0.5rem;
      }
      .success {
        color: #16a34a;
        font-size: 0.85rem;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="field" style="margin-bottom: 1rem">
      <label for="apiKeyInput">API-ключ (для создания/изменения заявок)</label>
      <input
        id="apiKeyInput"
        type="password"
        placeholder="Наберите здесь ваш API KEY" />
    </div>
    <h1>Заявки на обслуживание оборудования</h1>

    <h2>Фильтры</h2>
    <div class="filters">
      <div class="field">
        <label for="filterStatus">Статус</label>
        <select id="filterStatus">
          <option value="">Все</option>
          <option value="new">new</option>
          <option value="in_progress">in_progress</option>
          <option value="done">done</option>
          <option value="rejected">rejected</option>
        </select>
      </div>
      <div class="field">
        <label for="filterPriority">Приоритет</label>
        <select id="filterPriority">
          <option value="">Все</option>
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
          <option value="critical">critical</option>
        </select>
      </div>
      <div class="field">
        <label for="filterEquipment">Оборудование</label>
        <select id="filterEquipment">
          <option value="">Все</option>
        </select>
      </div>
      <button id="applyFilters">Применить</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Заголовок</th>
          <th>Оборудование</th>
          <th>Приоритет</th>
          <th>Статус</th>
          <th>Действие</th>
        </tr>
      </thead>
      <tbody id="requestsBody"></tbody>
    </table>
    <div id="listError" class="error"></div>

    <h2>Новая заявка</h2>
    <div class="form-grid">
      <div class="field">
        <label for="newEquipment">Оборудование *</label>
        <select id="newEquipment"></select>
      </div>
      <div class="field">
        <label for="newTitle">Заголовок *</label>
        <input id="newTitle" placeholder="5–120 символов" />
      </div>
      <div class="field">
        <label for="newPriority">Приоритет *</label>
        <select id="newPriority">
          <option value="low">low</option>
          <option value="medium" selected>medium</option>
          <option value="high">high</option>
          <option value="critical">critical</option>
        </select>
      </div>
      <div class="field">
        <label for="newDescription">Описание</label>
        <textarea
          id="newDescription"
          rows="1"
          placeholder="до 2000 символов"></textarea>
      </div>
      <button id="createBtn">Создать заявку</button>
    </div>
    <div id="formError" class="error"></div>
    <div id="formSuccess" class="success"></div>

    <script src="./script.js"></script>
  </body>
</html>
